<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyun Takas Pazarı</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #e0e0e0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        h1 { color: #2ecc71; margin-bottom: 20px; }
        .container { width: 100%; max-width: 500px; }
        .card { background-color: #1e1e1e; padding: 20px; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: #ffffff; }
        input { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; border: 1px solid #333; background-color: #2a2a2a; color: #fff; }
        button { width: 100%; padding: 12px; border: none; border-radius: 5px; background-color: #2ecc71; color: #fff; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #27ae60; }

        /* Giriş/Kayıt Modal */
        .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; }
        .auth-box { background: #1e1e1e; padding: 25px; border-radius: 10px; width: 90%; max-width: 350px; text-align: center; border: 1px solid #2ecc71; }
        .auth-error { color: #e74c3c; font-size: 0.85rem; margin-bottom: 10px; display: none; }
        .switch-auth { font-size: 0.8rem; color: #3498db; margin-top: 10px; cursor: pointer; text-decoration: underline; }

        /* İlan Kartı */
        .trade-item { background-color: #2a2a2a; border-left: 4px solid #2ecc71; padding: 12px; margin-bottom: 10px; border-radius: 4px; position: relative; }
        .delete-btn { position: absolute; top: 10px; right: 12px; color: #e74c3c; font-size: 1.2rem; font-weight: bold; cursor: pointer; }
        .delete-btn:hover { color: #ff6b6b; }
        .game-title { font-weight: bold; color: #2ecc71; font-size: 1.1rem; padding-right: 25px; }
        .contact-info { margin-top: 5px; font-size: 0.85rem; color: #f1c40f; }
        .trade-owner { font-size: 0.75rem; color: #888; margin-top: 3px; }
        .chat-btn { margin-top: 10px; background-color: #3498db; width: auto; padding: 8px 12px; font-size: 0.85rem; }
        .chat-btn:hover { background-color: #2980b9; }

        /* Mesajlaşma Modal */
        .chat-modal { display: none; position: fixed; bottom: 10px; right: 10px; width: 90%; max-width: 350px; height: 420px; background-color: #1e1e1e; border: 2px solid #3498db; border-radius: 10px; z-index: 1000; flex-direction: column; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .chat-header { background-color: #3498db; padding: 10px; color: white; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        .close-chat { cursor: pointer; font-weight: bold; }
        .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; word-break: break-word; font-size: 0.9rem; }
        .message.my-msg { background-color: #2ecc71; color: #121212; align-self: flex-end; }
        .message.other-msg { background-color: #ffffff; color: #121212; align-self: flex-start; }
        .msg-sender { font-size: 0.75rem; font-weight: bold; margin-bottom: 2px; opacity: 0.8; }
        .chat-input-area { display: flex; padding: 10px; gap: 5px; background-color: #121212; }
        .chat-input-area input { margin-bottom: 0; }
        .chat-input-area button { width: 70px; padding: 10px; }

        /* Silme Onay Modal */
        .confirm-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 3000; }
        .confirm-box { background: #1e1e1e; padding: 20px; border-radius: 8px; text-align: center; width: 80%; max-width: 300px; border: 1px solid #e74c3c; }
        .confirm-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .confirm-btn-yes { background-color: #e74c3c; }
        .confirm-btn-no { background-color: #7f8c8d; }
    </style>
</head>
<body>

    <!-- Giriş / Kayıt Ekranı -->
    <div id="authOverlay" class="auth-overlay">
        <div class="auth-box">
            <h2 id="authTitle">Kayıt Ol</h2>
            <div id="authError" class="auth-error"></div>
            
            <input type="text" id="authUsername" placeholder="Kullanıcı Adı">
            <input type="password" id="authPassword" placeholder="Şifre">
            
            <button id="authBtn" type="button" onclick="handleAuth()">Kaydol</button>
            <div id="switchAuth" class="switch-auth" onclick="toggleAuthMode()">Zaten hesabın var mı? Giriş Yap</div>
        </div>
    </div>

    <!-- Silme Onay Penceresi -->
    <div id="confirmModal" class="confirm-modal">
        <div class="confirm-box">
            <p>İlanı kaldırmak istiyor musun?</p>
            <div class="confirm-buttons">
                <button class="confirm-btn-yes" type="button" onclick="confirmDelete(true)">Evet</button>
                <button class="confirm-btn-no" type="button" onclick="confirmDelete(false)">Hayır</button>
            </div>
        </div>
    </div>

    <div class="container">
        <h1>🎮 Oyun Takas Pazarı</h1>
        <div style="text-align: right; margin-bottom: 10px; font-size: 0.9rem;">
            Kullanıcı: <b id="currentUserDisplay" style="color:#2ecc71;">-</b>
            <span style="font-size:0.75rem; color:#888; cursor:pointer; margin-left:8px;" onclick="logout()">(Çıkış Yap)</span>
        </div>

        <div class="card">
            <h2>Yeni Takas İlanı Oluştur</h2>
            <form id="tradeForm">
                <input type="text" id="game" placeholder="Oyun Adı (Örn: CS2, Roblox)" required>
                <input type="text" id="offer" placeholder="Verdiğin Eşya/Hesap" required>
                <input type="text" id="want" placeholder="İstediğin Eşya/Hesap" required>
                <input type="text" id="contact" placeholder="İletişim Bilgin (Discord / Roblox Adı)" required>
                <button type="submit">İlanı Yayınla</button>
            </form>
        </div>

        <div class="card">
            <h2>Aktif Takas İlanları</h2>
            <div id="tradesList">Yükleniyor...</div>
        </div>
    </div>

    <!-- Canlı Sohbet Kutusu -->
    <div id="chatModal" class="chat-modal">
        <div class="chat-header">
            <span id="chatTitle">İlan Sohbeti</span>
            <span class="close-chat" onclick="closeChat()">✖</span>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') sendMsg()">
            <button type="button" onclick="sendMsg()">Gönder</button>
        </div>
    </div>

    <script>
        const socket = io();
        let currentUser = null;
        let isLoginMode = false;
        let currentTradeId = null;
        let tradeToDeleteId = null;

        window.onload = function() {
            const savedUser = localStorage.getItem('trade_app_user');
            if (savedUser) {
                currentUser = savedUser;
                isLoginMode = true;
                document.getElementById('authTitle').innerText = savedUser + " - Şifre Gir";
                document.getElementById('authUsername').value = savedUser;
                document.getElementById('authUsername').style.display = 'none';
                document.getElementById('authBtn').innerText = "Giriş Yap";
                document.getElementById('switchAuth').style.display = 'none';
            }
        };

        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            document.getElementById('authError').style.display = "none";
            if (isLoginMode) {
                document.getElementById('authTitle').innerText = "Giriş Yap";
                document.getElementById('authBtn').innerText = "Giriş Yap";
                document.getElementById('switchAuth').innerText = "Hesabın yok mu? Kaydol";
            } else {
                document.getElementById('authTitle').innerText = "Kayıt Ol";
                document.getElementById('authBtn').innerText = "Kaydol";
                document.getElementById('switchAuth').innerText = "Zaten hesabın var mı? Giriş Yap";
            }
        }

        async function handleAuth() {
            const username = document.getElementById('authUsername').value.trim();
            const password = document.getElementById('authPassword').value.trim();
            const errorDiv = document.getElementById('authError');

            if (!password || (!isLoginMode && !username)) {
                errorDiv.innerText = "Lütfen alanları doldurun!";
                errorDiv.style.display = "block";
                return;
            }

            try {
                const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    currentUser = data.username;
                    localStorage.setItem('trade_app_user', currentUser);
                    document.getElementById('currentUserDisplay').innerText = currentUser;
                    document.getElementById('authOverlay').style.display = 'none';
                    fetchTrades();
                } else {
                    errorDiv.innerText = data.error || 'Bir hata oluştu!';
                    errorDiv.style.display = "block";
                }
            } catch (err) {
                errorDiv.innerText = "Sunucuya bağlanılamadı. Lütfen az sonra tekrar deneyin.";
                errorDiv.style.display = "block";
            }
        }

        function logout() {
            localStorage.removeItem('trade_app_user');
            location.reload();
        }

        async function fetchTrades() {
            try {
                const res = await fetch('/api/trades');
                const trades = await res.json();
                const container = document.getElementById('tradesList');
                container.innerHTML = '';
                
                if(trades.length === 0) {
                    container.innerHTML = '<p>Henüz ilan yok.</p>';
                    return;
                }

                trades.reverse().forEach(trade => {
                    const div = document.createElement('div');
                    div.className = 'trade-item';
                    div.innerHTML = `
                        <span class="delete-btn" onclick="openDeleteModal('${trade.id}')">✖</span>
                        <div class="game-title">[${trade.game}]</div>
                        <div>📤 <b>Verilen:</b> ${trade.offer}</div>
                        <div>📥 <b>İstenen:</b> ${trade.want}</div>
                        <div class="contact-info">💬 <b>İletişim:</b> ${trade.contact}</div>
                        <div class="trade-owner">İlan Sahibi: ${trade.owner || 'Anonim'}</div>
                        <button class="chat-btn" type="button" onclick="openChat('${trade.id}', '${trade.game}')">💬 Sohbet Et</button>
                    `;
                    container.appendChild(div);
                });
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('tradeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const game = document.getElementById('game').value;
            const offer = document.getElementById('offer').value;
            const want = document.getElementById('want').value;
            const contact = document.getElementById('contact').value;

            await fetch('/api/trades', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ game, offer, want, contact, owner: currentUser })
            });

            document.getElementById('tradeForm').reset();
            fetchTrades();
        });

        function openDeleteModal(tradeId) {
            tradeToDeleteId = tradeId;
            document.getElementById('confirmModal').style.display = 'flex';
        }

        async function confirmDelete(isYes) {
            document.getElementById('confirmModal').style.display = 'none';
            if (isYes && tradeToDeleteId) {
                await fetch('/api/trades/' + tradeToDeleteId, { method: 'DELETE' });
                fetchTrades();
            }
            tradeToDeleteId = null;
        }

        function openChat(tradeId, gameName) {
            currentTradeId = tradeId;
            document.getElementById('chatTitle').innerText = gameName + " - Takas Sohbeti";
            document.getElementById('chatMessages').innerHTML = '';
            document.getElementById('chatModal').style.display = 'flex';
            socket.emit('join_room', tradeId);
        }

        function closeChat() {
            document.getElementById('chatModal').style.display = 'none';
            currentTradeId = null;
        }

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if(msg && currentTradeId) {
                socket.emit('send_message', {
                    tradeId: currentTradeId,
                    sender: currentUser,
                    message: msg
                });
                input.value = '';
            }
        }

        socket.on('receive_message', (data) => {
            if(data.tradeId === currentTradeId) {
                const msgDiv = document.createElement('div');
                const isMe = data.sender === currentUser;
                
                msgDiv.className = `message ${isMe ? 'my-msg' : 'other-msg'}`;
                msgDiv.innerHTML = `
                    <div class="msg-sender">${data.sender}</div>
                    <div>${data.message}</div>
                `;
                document.getElementById('chatMessages').appendChild(msgDiv);
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            }
        });
    </script>
</body>
</html>
